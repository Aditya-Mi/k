name: CI

# Every push and PR: analyze and run both test suites (app + txn_parser),
# then (pushes to main) smoke test a release build on an emulator.
on:
  push:
    branches: [main]
    paths-ignore: ['design/**', '**.md']
  pull_request:
    paths-ignore: ['design/**', '**.md']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: |
          flutter pub get
          (cd packages/txn_parser && dart pub get)

      - name: Analyze
        run: flutter analyze

      - name: App tests
        run: flutter test

      - name: Parser tests
        working-directory: packages/txn_parser
        run: dart test

  smoke:
    name: Release build smoke test
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # Release build (R8 shrunk, debug-signed) for the x86_64 emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build smoke-test APK (x86_64)
        run: |
          flutter build apk --release --target-platform android-x64

      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: tool/smoke_test.sh build/app/outputs/flutter-apk/app-release.apk
