name: k
description: "Personal payment logger: bank SMS/email → transactions & subscriptions."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  txn_parser:
    path: packages/txn_parser
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  drift: ^2.35.1
  sqlite3: ^3.7.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  intl: ^0.20.3
  uuid: ^4.6.0
  crypto: ^3.0.7
  permission_handler: ^12.0.1
  rxdart: ^0.28.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  enough_mail: ^2.1.7
  google_sign_in: ^7.2.0
  http: ^1.6.0
  google_sign_in_platform_interface: ^3.1.0
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
flutter:
  uses-material-design: true
  fonts:
    # Variable font (wght 100–900, wdth 62–125). Bundled: no runtime font fetch.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo.ttf

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc   # bundle SQLite3MultipleCiphers → encrypted DB
